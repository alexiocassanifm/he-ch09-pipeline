# The regression eval-set, every night, in two jobs that cannot see each other's
# secrets. The agent job holds the model credential and a read-only token, and
# its checkout leaves out the graders. The score job holds no model credential,
# reads the graders, applies each patch to a clean tree and writes the bundle.
name: nightly-evals

on:
  schedule:
    - cron: "17 3 * * *"   # off the hour: scheduled runs are delayed at the start of every hour
  workflow_dispatch:
    inputs:
      model:
        description: Model ID to run the eval-set against
        default: claude-sonnet-5-5
      trials:
        description: Trials per task (k)
        default: "3"

permissions:
  contents: read

env:
  MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
  TRIALS: ${{ inputs.trials || '3' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: evals/tasks
      - id: plan
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          tasks = sorted(p.stem for p in pathlib.Path("evals/tasks").glob("*.yaml"))
          runs = [{"task": t, "trial": n} for t in tasks for n in range(1, int(os.environ["TRIALS"]) + 1)]
          print("matrix=" + json.dumps({"include": runs}))
          EOF

  agent:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evals/checks/
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r requirements.lock
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Install the pinned Claude Code from its lockfile
        run: npm ci --prefix tools
      - name: Run the agent on one task, once
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"   # the agent's shell never sees the token
          DISABLE_AUTOUPDATER: "1"
        run: |
          python3 scripts/predict.py \
            --task "evals/tasks/${{ matrix.task }}.yaml" --trial "${{ matrix.trial }}" \
            --model "$MODEL" --claude tools/node_modules/.bin/claude \
            --out "$RUNNER_TEMP/run-${{ matrix.task }}-${{ matrix.trial }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: run-${{ matrix.task }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/run-${{ matrix.task }}-${{ matrix.trial }}
          retention-days: 90

  score:
    needs: agent
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r requirements.lock
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: run-*
          path: runs
      - name: Grade every run against checks the agent never saw
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          python3 scripts/grade.py --runs runs --tasks evals/tasks --out predictions.jsonl
          python3 evals/score.py --dataset evals/tasks --predictions predictions.jsonl
          python3 evals/score.py --dataset evals/tasks --predictions predictions.jsonl --json > scores.json
      - name: Write the audit manifest
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          cp predictions.jsonl runs/
          python3 scripts/bundle.py --inputs runs --out bundle --needs "$NEEDS" --scores scores.json
          cp predictions.jsonl scores.json bundle/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nightly-bundle
          path: bundle
          retention-days: 90
      - uses: actions/attest@v4.2.2
        with:
          subject-path: bundle/manifest.json
